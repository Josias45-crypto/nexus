  "De nada, {trato}. Aquí sigo.",
  "Con gusto, {trato}.",
  "Para servirle, {trato}.",
]
despedida = [
  "Hasta luego, {trato}. Cuídese.",
  "Que le vaya bonito, {trato}. Aquí lo espero.",
]
noche = [
  "Que descanse, {trato}. Hasta mañana.",
  "Buenas noches, {trato}; aquí lo espero mañana.",
]
no_entendi = [
  "¿Me lo repite, {trato}? No le entendí bien.",
  "Perdón, {trato}, no le capté. ¿Me lo dice de otra forma?",
]
archivo = [
  "Recibí «{archivo}», {trato}. Lo leo y lo guardo en mi memoria.",
]
duplicado = [
  "Ese ya lo tenía guardado, {trato}.",
]
sin_memoria = [
  "Esto no sale de mi memoria, {trato}: es lo que sé en general.",
  "No lo tengo en sus notas, {trato}; le cuento lo que sé en general.",
  "Esto no viene de su memoria, {trato}: es saber general.",
  "En sus notas no hay nada de esto, {trato}, pero en general es así.",
  "De mi memoria no sale, {trato}; esto es conocimiento general.",
]
profundo = "Lo pensé con el modelo potente, {trato}; esta respuesta cuesta un poco más."
ayuda = """Escríbame como a una persona, {trato}, sin comandos. Por ejemplo:
• «recuerda esto: Rosa paga los viernes» y lo guardo tal cual.
• «¿cuánto me debe Rosa?» y lo busco en mi memoria.
• «recuérdame mañana a las 9 llamar a Pedro».
• «¿qué recordatorios tengo?», «ya lo hice», «cancela el recordatorio 3».
• «analiza a fondo…» o «dame tu opinión…» para pensarlo con más cuidado (cuesta un poco más).
También puede mandarme fotos, documentos y notas de voz: los veo y los escucho. Los videos los guardo."""

# Recordatorios (sin IA). {tarea}, {hora} y {cuando} los pone el código. De usted, cortos;
# las insistencias van cada vez más suaves y nunca culpan. Nunca se repite la variante anterior.
[recordatorios]
previo = [
  "{trato}, en 30 minutos le toca: {tarea}.",
  "Un aviso, {trato}: a las {hora} tiene que {tarea}.",
  "{trato}, le adelanto que a las {hora} le toca {tarea}.",
  "Para que lo tenga presente, {trato}: en media hora, {tarea}.",
]
hora = [
  "⏰ {trato}, ya es hora: {tarea}.",
  "⏰ Es el momento, {trato}: {tarea}.",
  "⏰ {trato}, le recuerdo: {tarea}.",
  "⏰ Llegó la hora, {trato}: {tarea}.",
]
insistencia1 = [
  "{trato}, ¿pudo hacerlo? {tarea}.",
  "Le vuelvo a recordar, {trato}: {tarea}.",
  "{trato}, sigue pendiente: {tarea}.",
]
insistencia2 = [
  "{trato}, sin apuro: cuando pueda, {tarea}.",
  "Le dejo el recordatorio otra vez, {trato}: {tarea}.",
  "{trato}, aquí sigue esperando: {tarea}. Si quiere lo muevo a otra hora.",
]
insistencia3 = [
  "Último aviso por ahora, {trato}: {tarea}. Ya no insisto; si lo hizo, me avisa.",
  "{trato}, lo dejo aquí: {tarea}. Cuando pueda, me cuenta cómo le fue.",
  "Ya no le insisto más, {trato}: {tarea}. Queda anotado como pendiente.",
]
