# Iniciativa propia (core/iniciativa.py): saludos de mañana y de noche. Horas locales HH:MM.
# El silencio no aplica a los recordatorios ni a una hora que el jefe pidió («mañana me levanto a
# las 5»). Si el sistema estuvo apagado, cada saludo sale solo hasta su «hasta»; si no, se salta.
[iniciativa]
manana = "07:30"
noche = "21:30"
silencio_desde = "23:00"
silencio_hasta = "06:00"
manana_hasta = "11:00"
noche_hasta = "23:00"
conversando_min = 30     # si él escribió hace menos, se espera...
espera_max_min = 60      # ...hasta esto después de la hora; si sigue conversando, se salta
dias_sin_respuesta = 3   # días seguidos sin respuesta antes de preguntar si le escribe menos
# Respaldo si la IA falla o su texto no pasa la verificación (10 por saludo, arranques distintos)
