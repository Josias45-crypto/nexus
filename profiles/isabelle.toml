  "Eso no lo tengo, {trato}; déjeme buscarlo en internet un momento.",
  "No está en mi memoria, {trato}. Lo busco en internet y le cuento.",
  "Eso no lo sé de memoria, {trato}; un momentito, lo busco en internet.",
]
