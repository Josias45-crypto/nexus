services:
  ollama:
    image: ollama/ollama:0.35.1
    container_name: nexus-ollama
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

  core:
    build: .
    container_name: nexus-core
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data
      - whisper_models:/models
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_models:
  whisper_models:
