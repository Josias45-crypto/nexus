services:
  core:
    build: .
    container_name: nexus-core
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data
      - ${NEXUS_BACKUP_HOST_DIR:-./backups}:/backups
      - ./profiles:/app/profiles:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    restart: unless-stopped

  # Canal de Telegram (opcional): docker compose --profile channels up -d
  # Long polling: no abre puertos. Solo responde a TELEGRAM_ALLOWED_IDS.
  telegram:
    build: .
    container_name: nexus-telegram
    command: ["python", "-m", "channels.telegram"]
    env_file: .env
    environment:
      NEXUS_API_URL: http://core:8000
    depends_on:
      core:
        condition: service_healthy
    profiles: ["channels"]
    restart: unless-stopped

  # WhatsApp oficial (Cloud API de Meta), APAGADO por defecto: requiere NEXUS_WHATSAPP=on,
  # cuenta de Meta Business y HTTPS público hacia este puerto (docs/CANALES.md).
  # docker compose --profile whatsapp up -d
  whatsapp:
    build: .
    container_name: nexus-whatsapp
    command: ["python", "-m", "channels.whatsapp"]
    env_file: .env
    environment:
      NEXUS_API_URL: http://core:8000
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      core:
        condition: service_healthy
    profiles: ["whatsapp"]
    restart: on-failure:3
