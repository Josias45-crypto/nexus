# Proyecto fijo «isabelle»: contenedores isabelle-core-1, isabelle-telegram-1... e imágenes
# isabelle-core, isabelle-telegram. Sin container_name ni volúmenes con nombre: no choca con otros
# servicios del mismo servidor. Los datos van en carpetas del proyecto (./data, ./backups).
name: isabelle

# Rotación de logs de Docker: como mucho 10 MB x 3 archivos por servicio
x-logs: &logs
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  core:
    <<: *logs
    build: .
    env_file: .env
    ports:
      # Por defecto solo en 127.0.0.1 (se entra por túnel SSH). NEXUS_BIND=0.0.0.0 publica la web por
      # HTTP sin cifrar (riesgos en docs/DESPLIEGUE.md). El puerto, por NEXUS_PORT (en el VPS: 8100)
      - "${NEXUS_BIND:-127.0.0.1}:${NEXUS_PORT:-8000}:8000"
    volumes:
      - ./data:/data
      - ${NEXUS_BACKUP_HOST_DIR:-./backups}:/backups
      - ./profiles:/app/profiles:ro
    healthcheck:
      test: ["CMD", "python", "-m", "core.auth", "salud"]  # /health con el token interno
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 1g
    stop_grace_period: 30s
    restart: unless-stopped

  # Canal de Telegram (opcional): docker compose --profile channels up -d
  # Long polling: no abre puertos. Solo responde a TELEGRAM_ALLOWED_IDS.
  telegram:
    <<: *logs
    build: .
    command: ["python", "-m", "channels.telegram"]
    env_file: .env
    environment:
      NEXUS_API_URL: http://core:8000
    volumes:
      - ./data/interno:/data/interno:ro  # token interno para hablar con el núcleo
    healthcheck:
      test: ["CMD", "python", "-m", "channels.salud"]  # el núcleo responde con el token interno
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 256m
    depends_on:
      core:
        condition: service_healthy
    profiles: ["channels"]
    restart: unless-stopped

  # WhatsApp oficial (Cloud API de Meta), APAGADO por defecto: requiere NEXUS_WHATSAPP=on,
  # cuenta de Meta Business y HTTPS público hacia este puerto (docs/CANALES.md).
  # docker compose --profile whatsapp up -d
  whatsapp:
    <<: *logs
    build: .
    command: ["python", "-m", "channels.whatsapp"]
    env_file: .env
    environment:
      NEXUS_API_URL: http://core:8000
    volumes:
      - ./data/interno:/data/interno:ro  # token interno para hablar con el núcleo
    ports:
      - "127.0.0.1:${NEXUS_WHATSAPP_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "python", "-m", "channels.salud"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 256m
    depends_on:
      core:
        condition: service_healthy
    profiles: ["whatsapp"]
    restart: unless-stopped
