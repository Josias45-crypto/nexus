services:
  ollama:
    image: ollama/ollama:0.35.1
    container_name: nexus-ollama
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # Descarga los modelos solo si faltan (sin internet arranca igual si ya están).
  ollama-models:
    image: ollama/ollama:0.35.1
    container_name: nexus-ollama-models
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        for m in "${NEXUS_LLM_MODEL:-qwen2.5:1.5b}" "${NEXUS_EMBED_MODEL:-nomic-embed-text}"; do
        ollama show "$$m" >/dev/null 2>&1 && echo "modelo $$m listo" ||
        { echo "descargando $$m..."; ollama pull "$$m" || exit 1; };
        done
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  core:
    build: .
    container_name: nexus-core
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data
      - whisper_models:/models
      - ${NEXUS_BACKUP_HOST_DIR:-./backups}:/backups
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    depends_on:
      ollama:
        condition: service_healthy
      ollama-models:
        condition: service_completed_successfully
    restart: unless-stopped

  # Canal de Telegram (opcional): docker compose --profile channels up -d
  # Long polling: no abre puertos. Solo responde a TELEGRAM_ALLOWED_IDS.
  telegram:
    build: .
    container_name: nexus-telegram
    command: ["python", "-m", "channels.telegram"]
    env_file: .env
    environment:
      NEXUS_API_URL: http://core:8000
    depends_on:
      core:
        condition: service_healthy
    profiles: ["channels"]
    restart: unless-stopped

  # WhatsApp oficial (Cloud API de Meta), APAGADO por defecto: requiere NEXUS_WHATSAPP=on,
  # cuenta de Meta Business y HTTPS público hacia este puerto (docs/CANALES.md).
  # docker compose --profile whatsapp up -d
  whatsapp:
    build: .
    container_name: nexus-whatsapp
    command: ["python", "-m", "channels.whatsapp"]
    env_file: .env
    environment:
      NEXUS_API_URL: http://core:8000
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      core:
        condition: service_healthy
    profiles: ["whatsapp"]
    restart: on-failure:3

volumes:
  ollama_models:
  whisper_models:
